name: 问题反馈
description: 报告连接、登录、界面或安装问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "请勿提交真实账号、密码、Token、Cookie、私钥或浏览器配置。"
  - type: input
    id: version
    attributes:
      label: SEUSC 版本
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 操作系统与架构
      placeholder: Windows 11 x64
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏后的 doctor 输出或错误码
      render: text
